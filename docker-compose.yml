services:
  postgres:
    image: postgres:16-alpine
    container_name: webapi-tester-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: webapi_tester
      POSTGRES_USER: webapi
      POSTGRES_PASSWORD: webapi
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U webapi -d webapi_tester']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    container_name: webapi-tester-postgres-test
    profiles: ['test']
    environment:
      POSTGRES_DB: webapi_tester_test
      POSTGRES_USER: webapi
      POSTGRES_PASSWORD: webapi
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U webapi -d webapi_tester_test']
      interval: 5s
      timeout: 5s
      retries: 5

  proxy:
    build:
      context: .
      dockerfile: apps/proxy/Dockerfile
    container_name: webapi-tester-proxy
    restart: unless-stopped
    environment:
      PROXY_PORT: '3002'
      PROXY_BIND_HOST: '0.0.0.0'
      PROXY_KEY_FILE: /app/data/agent-key
    ports:
      - '127.0.0.1:3002:3002'
    volumes:
      - proxy-key:/app/data

volumes:
  pgdata:
    name: webapi-tester-pgdata
  proxy-key:
    name: webapi-tester-proxy-key